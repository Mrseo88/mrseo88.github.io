<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07040c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Longshade: tap to become your shadow. A one-tap pixel-art arcade game.">
<title>Longshade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg: #07040c; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    /* Capacitor (Android) injects --safe-area-inset-*; browsers and iOS use env(). */
    padding: var(--safe-area-inset-top, env(safe-area-inset-top)) var(--safe-area-inset-right, env(safe-area-inset-right)) var(--safe-area-inset-bottom, env(safe-area-inset-bottom)) var(--safe-area-inset-left, env(safe-area-inset-left));
    box-sizing: border-box;
  }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; cursor: pointer; }
  noscript { color: #fff2d6; font-family: monospace; }
</style>
</head>
<body>
<canvas id="game" width="180" height="320" aria-label="Longshade: tap the screen to become your shadow"></canvas>
<noscript>Longshade requires JavaScript.</noscript>
<script type="module" src="js/game.js"></script>
<script>
  // No service worker inside the native app (files are already local) or in automated runs.
  const nativeShell = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  if (!nativeShell && 'serviceWorker' in navigator && location.protocol !== 'file:' && !new URLSearchParams(location.search).has('autoplay')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
