<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Na cosa particolare!</title>
<meta name="description" content="Prendi al volo gli ingredienti giusti e sforna panini da paura. Un gioco gratis nel browser di Mrcosy Games.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#1a1424; }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5);cursor:pointer}
</style>
</head>
<body>
<canvas id="c" aria-label="Na cosa particolare: gioco"></canvas>
<script>
"use strict";
// ============================================================
//  NA COSA PARTICOLARE! — Mrcosy Games
// ============================================================
const W = 450, H = 800;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT_T = "'Lilita One', 'Arial Black', sans-serif";
const FONT_B = "'Nunito', 'Arial Rounded MT Bold', sans-serif";

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

// ---------- utils ----------
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const OUT = '#231a17';
function fs(fill, lw = 3) { ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = OUT; ctx.stroke(); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); }

let best = 0;
try { best = +localStorage.getItem('ncpBest') || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem('ncpBest', best); } catch (e) {} }

// ---------- audio ----------
let AC = null, muted = false;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function note(f, t0, d, type, v, slide) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + d + 0.03);
}
function tone(f, d = 0.1, type = 'square', v = 0.08, slide = 0, delay = 0) {
  if (!AC || muted) return; note(f, AC.currentTime + delay, d, type, v, slide);
}
const sfx = {
  catch(c) { tone(440 + c * 30, .06, 'square', .05); tone(660 + c * 30, .07, 'square', .04, 0, .05); },
  served() { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, .1, 'triangle', .08, 0, i * .06)); tone(1568, .25, 'sine', .05, 0, .3); },
  wrong() { tone(260, .35, 'sawtooth', .07, -150); tone(180, .4, 'square', .04, -80, .1); },
  bad() { tone(140, .3, 'square', .09, -80); tone(90, .45, 'sawtooth', .07, -40, .08); },
  special() { [587, 740, 880, 1175].forEach((f, i) => tone(f, .12, 'triangle', .08, 0, i * .07)); },
  dodge() { tone(990, .05, 'sine', .04); },
  hot() { tone(300, .5, 'sine', .06, 400); },
  level() { [392, 523, 659, 784, 659, 784, 1046].forEach((f, i) => tone(f, .16, 'triangle', .08, 0, i * .12)); },
  over() { [392, 349, 294, 262, 196].forEach((f, i) => tone(f, .3, 'triangle', .08, 0, i * .2)); },
  shout() { tone(880, .7, 'sawtooth', .09, -500); tone(660, .7, 'square', .05, -380, .05); tone(1320, .5, 'triangle', .05, -900, .1); },
  timeout() { tone(520, .15, 'square', .05); tone(390, .3, 'square', .05, 0, .16); },
};
// Motivetto napoletano originale in 6/8 (MIDI)
const MEL = [72,76,79,76,74,72, 71,74,77,74,72,71, 69,72,76,72,71,69, 67,71,74,79,0,79,
             72,76,79,81,79,76, 77,74,71,74,77,81, 79,77,76,74,72,71, 72,0,67,72,0,0];
const BASS = [48,0,55,48,0,55, 43,0,50,43,0,50, 45,0,52,45,0,52, 43,0,50,43,0,50,
              48,0,55,45,0,52, 50,0,57,43,0,50, 43,0,50,43,0,50, 48,0,55,48,0,0];
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
let mStep = 0, mNext = 0;
function musicTick() {
  if (!AC || muted || state !== 'play') { if (AC) mNext = AC.currentTime; return; }
  const spd = Math.max(.1, .15 - (level - 1) * .014);
  while (mNext < AC.currentTime + 0.2) {
    if (mNext < AC.currentTime) mNext = AC.currentTime + 0.02;
    const n = MEL[mStep % MEL.length], b = BASS[mStep % BASS.length];
    if (n) note(midi(n), mNext, spd * .8, 'square', .02);
    if (b) note(midi(b), mNext, spd * .9, 'triangle', .05);
    mNext += spd; mStep++;
  }
}

// ---------- data ----------
// h = spessore dello strato nel panino
const ING = {
  salsiccia:  { n: 'Salsiccia',  h: 16, c: '#8a4a2b' },
  friarielli: { n: 'Friarielli', h: 12, c: '#2f6b2a' },
  provola:    { n: 'Provola',    h: 12, c: '#f3e3b0' },
  patatine:   { n: 'Patatine',   h: 14, c: '#f5c542' },
  wurstel:    { n: 'Würstel',    h: 14, c: '#d9805a' },
  cotoletta:  { n: 'Cotoletta',  h: 14, c: '#d39a3c' },
  melanzane:  { n: 'Melanzane',  h: 12, c: '#5b2d6e' },
  pomodoro:   { n: 'Pomodoro',   h: 10, c: '#e2382c' },
};
const BAD = {
  ciabatta:    { n: 'CIABATTA', line: 'AHIA! La ciabatta no!', col: '#c0392b' },
  bolletta:    { n: 'BOLLETTA', line: 'La bolletta della luce?!', col: '#2d6cdf' },
  ananas:      { n: 'ANANAS',   line: "L'ananas nel panino?! MAI!", col: '#e5a50a' },
  peperoncino: { n: 'PEPERONCINO', line: 'MAMMA MIA CHE CALDO!', col: '#e2382c' },
};
const SPECIAL = {
  spaghetti:   { n: 'SPAGHETTI', col: '#e2382c' },
  asciugamano: { n: 'ASCIUGAMANO', col: '#e86fa6' },
};
const LEVELS = [
  { name: 'Pranzo alla paninoteca', bg: 'shop', goal: 3, spawn: 54, speed: 3.0, badP: .1, len: [3, 3], time: 16, heat: .028,
    pool: ['salsiccia', 'friarielli', 'provola', 'patatine', 'wurstel'], bads: ['ciabatta', 'bolletta', 'peperoncino'],
    quote: '"Na cosa particolare!"' },
  { name: 'Sera: c\'è la fila', bg: 'evening', goal: 4, spawn: 46, speed: 3.5, badP: .14, len: [3, 4], time: 15, heat: .04,
    pool: ['salsiccia', 'friarielli', 'provola', 'patatine', 'wurstel', 'cotoletta', 'melanzane'], bads: ['ciabatta', 'bolletta', 'peperoncino', 'ananas'],
    quote: '"KATERINAAA! Che serata!"' },
  { name: 'Sabato a Giugliano', bg: 'street', goal: 999, spawn: 38, speed: 4.0, badP: .17, len: [4, 5], time: 14, heat: .055,
    pool: Object.keys(ING), bads: ['ciabatta', 'bolletta', 'peperoncino', 'ananas'], quote: '' },
];
function L() {
  const b = LEVELS[Math.min(level, LEVELS.length) - 1];
  if (level <= LEVELS.length) return b;
  const k = level - LEVELS.length;
  return { ...b, spawn: Math.max(24, b.spawn - k * 3), speed: b.speed + k * .25, badP: Math.min(.28, b.badP + k * .02) };
}
const CHEF_OK = ['Uè!', 'Jamme!', 'Che bontà!', 'Na cosa particolare!', 'Mamma mì!', 'E vai!', 'Bellissimo!'];
const CHEF_DONE = ['Na cosa particolare!', 'Na cosa particolare!', 'Na cosa particolare!', 'Ecco qua!', 'Capolavoro!'];
const CEC = ['Chef, un panino!', 'Muoviti, c\'è gente!', 'Un altro, chef!', 'Il cliente aspetta!', 'Jamme, chef!'];
const CEC_OK = ['Bravo amore!', 'Finalmente!', 'Ecco, bravo!', 'Sei un mito!'];
const CEC_WRONG = ['Ma che ci hai messo?!', 'Chef! Che è sta roba?!', 'Ricomincia!', 'Ma sei scemo?!'];
const CEC_LATE = ['Se n\'è andato!', 'Troppo lento!', 'Il cliente è sparito!'];
const OVER = ['Si chiude la cassa.', 'Stasera si mangia a casa.', 'I clienti vanno dalla concorrenza.', 'Domani si riapre, chef!'];

// ---------- state ----------
let state = 'title', level = 1, score = 0, lives = 3, combo = 0, t = 0, spawnT = 0;
let served = 0, orderNo = 0, order = null, stack = [], serveT = 0, serveFly = null, trash = [];
let items = [], parts = [], texts = [];
let fx = { frenzy: 0, hurt: 0, shake: 0, stun: 0 };
let heat = 0, wipeT = 0;
let NEED_P = .62;
let shoutT = 0;              // urlo KATERINAAA!
const SHOUT_EVERY = 8;          // probabilità che cada un ingrediente dello scontrino
let overT = 0, overLine = '';
const chef = { x: W / 2, vx: 0, face: 'happy', faceT: 0, bubble: '', bubbleT: 0, bob: 0 };
const cec = { bubble: '', bubbleT: 0, face: 'happy', faceT: 0 };
const keys = { left: false, right: false };
let pointerX = null, pointerDown = false;
const GROUND = H - 34;
const TRAY = GROUND - 226;                 // altezza del vassoio sopra la testa

function stackH() { let h = 10; for (const s of stack) h += ING[s] ? ING[s].h : 0; return h; }
function stackTop() { return TRAY - stackH(); }

function newOrder() {
  const lv = L();
  const n = Math.floor(rand(lv.len[0], lv.len[1] + 1));
  const pool = lv.pool.slice(), need = [];
  while (need.length < n && pool.length) need.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  orderNo++;
  order = { need, got: [], time: lv.time * 60, max: lv.time * 60, no: orderNo };
  stack = [];
}
function startGame() {
  level = 1; score = 0; lives = 3; combo = 0; served = 0; orderNo = 0;
  startLevel(); state = 'play';
}
function startLevel() {
  items = []; trash = []; serveFly = null; serveT = 0; spawnT = 40; served = 0;
  fx.frenzy = fx.hurt = fx.stun = 0; heat = Math.min(heat, 30); wipeT = 0;
  chef.x = W / 2; pointerX = null;
  newOrder();
  say(cec, pick(CEC), 120);
}
function say(who, s, d = 90) { who.bubble = s; who.bubbleT = d; }
function addText(x, y, s, c = '#fff', size = 22) { texts.push({ x, y, s, c, size, life: 60 }); }
function burst(x, y, c, n = 12) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: rand(-4, 4), vy: rand(-6, -1), life: rand(25, 45), c, s: rand(3, 6) });
}
function missing() { return order ? order.need.filter(n => !order.got.includes(n)) : []; }

function spawn() {
  const lv = L(), r = Math.random();
  let kind, type;
  if (r < lv.badP) { kind = 'bad'; type = pick(lv.bads); }
  else if (r < lv.badP + .045) { kind = 'special'; type = heat > 55 && Math.random() < .6 ? 'asciugamano' : pick(Object.keys(SPECIAL)); }
  else {
    kind = 'ing';
    const miss = missing();
    type = miss.length && Math.random() < NEED_P ? pick(miss) : pick(lv.pool);
  }
  items.push({ kind, type, x: rand(46, W - 46), y: 168, vy: rand(.5, 1.5), vmax: lv.speed * rand(.85, 1.15),
    vx: rand(-1.1, 1.1), rot: rand(-.4, .4), vr: rand(-.05, .05) });
}

function trashStack() {
  let y = TRAY - 10;
  trash.push({ k: 'pane', x: chef.x, y: TRAY, vx: rand(-3, 3), vy: rand(-5, -2), rot: 0, vr: rand(-.2, .2) });
  for (const s of stack) { const h = ING[s].h; y -= h; trash.push({ k: s, x: chef.x, y: y + h / 2, vx: rand(-4, 4), vy: rand(-7, -2), rot: 0, vr: rand(-.25, .25) }); }
  stack = []; if (order) order.got = [];
}

function catchItem(it) {
  chef.bob = 10;
  if (it.kind === 'ing') {
    if (order && order.need.includes(it.type) && !order.got.includes(it.type)) {
      combo++;
      const mult = (1 + Math.floor(combo / 4) * .5) * (fx.frenzy > 0 ? 2 : 1);
      const pts = Math.round(10 * mult);
      score += pts; stack.push(it.type); order.got.push(it.type);
      chef.face = 'yum'; chef.faceT = 25;
      addText(it.x, stackTop() - 10, '+' + pts, fx.frenzy > 0 ? '#ffd23f' : '#fff');
      burst(it.x, stackTop(), ING[it.type].c, 8);
      sfx.catch(Math.min(combo, 12));
      if (Math.random() < .25) say(chef, pick(CHEF_OK), 60);
      if (missing().length === 0) serveOrder();
      if (combo % SHOUT_EVERY === 0) shout();
    } else {
      // ingrediente sbagliato: panino da rifare
      combo = 0; lives--; fx.hurt = 50; fx.shake = 12;
      chef.face = 'shock'; chef.faceT = 50;
      stack.push(it.type); trashStack();
      say(cec, pick(CEC_WRONG), 100); cec.face = 'angry'; cec.faceT = 90;
      addText(it.x, TRAY - 60, order && order.need.includes(it.type) ? 'DOPPIO!' : 'SBAGLIATO!', '#ff5e5b', 30);
      sfx.wrong();
      if (lives <= 0) gameOver();
    }
  } else if (it.kind === 'bad') {
    combo = 0;
    burst(it.x, it.y, BAD[it.type].col, 16);
    say(chef, BAD[it.type].line, 100);
    chef.face = 'shock'; chef.faceT = 60;
    if (it.type === 'peperoncino') {
      heat = Math.min(100, heat + 45); fx.shake = 8; sfx.hot();
      addText(it.x, it.y - 20, '🌶️ +CALDO', '#ff7b54', 26);
    } else {
      lives--; fx.hurt = 50; fx.shake = 14; sfx.bad();
      if (it.type === 'ciabatta') { fx.stun = 40; addText(it.x, it.y - 20, 'CIABATTATA!', '#fff', 34); }
      else if (it.type === 'bolletta') { score = Math.max(0, score - 30); addText(it.x, it.y - 20, '-30 €', '#7fb2ff', 34); }
      else { trashStack(); addText(it.x, it.y - 20, '🍍?!', '#fff', 44); say(cec, 'L\'ANANAS?! NO!', 100); cec.face = 'angry'; cec.faceT = 90; }
      if (lives <= 0) gameOver();
    }
  } else if (it.type === 'spaghetti') {
    score += 50; fx.frenzy = 420;
    chef.face = 'yum'; chef.faceT = 60; say(chef, 'Spaghetti! Forza totale!', 100);
    addText(it.x, it.y - 10, 'PAUSA SPAGHETTI x2', '#ffd23f', 26);
    burst(it.x, it.y, '#e2382c', 22); sfx.special();
  } else {
    heat = 0; if (lives < 3) lives++;
    chef.face = 'yum'; chef.faceT = 60; say(chef, 'Ahh, che fresco!', 90);
    addText(it.x, it.y - 10, lives === 3 ? 'FRESCO!' : '+1 ❤', '#ff9ccf', 28);
    burst(it.x, it.y, '#ff9ccf', 18); sfx.special();
  }
}

function shout() {
  shoutT = 60; fx.shake = 12;
  chef.face = 'shout'; chef.faceT = 55;
  say(chef, 'KATERINAAA!', 80);
  let n = 0;
  for (const it of items) {
    const needed = it.kind === 'ing' && order && order.need.includes(it.type) && !order.got.includes(it.type);
    if (it.kind === 'bad' || (it.kind === 'ing' && !needed)) {
      it.done = true; n++; burst(it.x, it.y, '#fff', 10);
      addText(it.x, it.y, '+20', '#7df9ff', 18);
    }
  }
  score += n * 20;
  sfx.shout();
}
function serveOrder() {
  const bonus = Math.round(100 + (order.time / order.max) * 100) * (fx.frenzy > 0 ? 2 : 1);
  score += bonus; served++;
  serveFly = { stack: stack.slice(), x: chef.x, y: TRAY, k: 0 };
  serveT = 40;
  stack = [];
  addText(chef.x, TRAY - 90, 'NA COSA PARTICOLARE! +' + bonus, '#ffd23f', 24);
  burst(chef.x, TRAY - 40, '#ffd23f', 26);
  say(chef, pick(CHEF_DONE), 70); say(cec, pick(CEC_OK), 80); cec.face = 'happy';
  sfx.served();
  order = null;
}

function gameOver() {
  state = 'over'; overT = 0; overLine = pick(OVER);
  if (score > best) { best = score; saveBest(); }
  sfx.over();
}

// ---------- update ----------
function update(dt) {
  t += dt;
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += .25 * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const s of texts) { s.y -= .9 * dt; s.life -= dt; }
  texts = texts.filter(s => s.life > 0);
  for (const tr of trash) { tr.x += tr.vx * dt; tr.y += tr.vy * dt; tr.vy += .35 * dt; tr.rot += tr.vr * dt; }
  trash = trash.filter(tr => tr.y < H + 40);
  if (chef.bubbleT > 0) chef.bubbleT -= dt;
  if (cec.bubbleT > 0) cec.bubbleT -= dt;
  if (cec.faceT > 0) { cec.faceT -= dt; if (cec.faceT <= 0) cec.face = 'happy'; }
  if (chef.bob > 0) chef.bob -= dt;
  if (state === 'over') overT += dt;
  if (state !== 'play') return;

  const lv = L();
  for (const k of ['frenzy', 'hurt', 'stun']) if (fx[k] > 0) fx[k] -= dt;
  if (shoutT > 0) shoutT -= dt;
  if (fx.shake > 0) fx.shake -= dt;
  if (chef.faceT > 0) { chef.faceT -= dt; if (chef.faceT <= 0) chef.face = 'happy'; }

  // caldo e asciugamano
  if (wipeT > 0) {
    wipeT -= dt; heat = Math.max(0, heat - .9 * dt);
    if (wipeT <= 0) chef.face = 'happy';
  } else {
    heat += lv.heat * dt * (fx.frenzy > 0 ? 1.3 : 1);
    if (heat >= 100) {
      heat = 100; wipeT = 75; chef.face = 'hot'; chef.faceT = 75;
      say(chef, 'Che caldo... un attimo!', 80); sfx.hot();
    }
  }

  // movimento
  const frozen = wipeT > 0 || fx.stun > 0;
  const spd = 7.2 * (heat > 70 ? .8 : 1);
  const px = chef.x;
  const dir = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
  if (!frozen) {
    if (dir) { chef.x += dir * spd * dt; pointerX = null; }
    else if (pointerX != null) chef.x += clamp(pointerX - chef.x, -spd * 1.6 * dt, spd * 1.6 * dt);
  }
  chef.x = clamp(chef.x, 44, W - 44);
  chef.vx = (chef.x - px) / Math.max(dt, .001);

  // ordine
  if (serveFly) { serveFly.k += dt / 34; if (serveFly.k >= 1) serveFly = null; }
  if (serveT > 0) {
    serveT -= dt;
    if (serveT <= 0) {
      if (served >= lv.goal) { state = 'levelup'; items = []; sfx.level(); burst(chef.x, TRAY, '#ffd23f', 30); return; }
      newOrder(); say(cec, pick(CEC), 90);
    }
  } else if (order) {
    order.time -= dt;
    if (order.time <= 0) {
      lives--; combo = 0; fx.hurt = 50; sfx.timeout();
      say(cec, pick(CEC_LATE), 100); cec.face = 'angry'; cec.faceT = 90; say(chef, 'KATERINAAA! Aiuto!', 90);
      addText(W / 2, 330, 'CLIENTE ANDATO VIA!', '#ff5e5b', 26);
      trashStack();
      if (lives <= 0) { gameOver(); return; }
      newOrder();
    }
  }

  // spawn
  spawnT -= dt * (fx.frenzy > 0 ? 1.35 : 1);
  if (spawnT <= 0) { spawn(); spawnT = lv.spawn * rand(.75, 1.2); }

  // oggetti che cadono
  const top = stackTop(), hw = 52;
  for (const it of items) {
    const prevY = it.y;
    it.vy = Math.min(it.vmax, it.vy + .12 * dt);
    it.x += it.vx * dt; it.y += it.vy * dt; it.rot += it.vr * dt;
    if (it.x < 28 || it.x > W - 28) { it.vx *= -1; it.x = clamp(it.x, 28, W - 28); }
    if (fx.frenzy > 0 && it.kind === 'ing' && order && order.need.includes(it.type) && it.y > 300 && it.y < top) it.x += (chef.x - it.x) * .04 * dt;
    if (!it.done && serveT <= 0 && prevY <= top + 4 && it.y >= top - 2 && Math.abs(it.x - chef.x) < hw) {
      it.done = true; catchItem(it);
      if (state !== 'play') return;
    }
    if (!it.done && it.y > top + 40 && !it.passed) {
      it.passed = true;
      if (it.kind === 'bad') { score += 5; addText(it.x, GROUND - 40, 'Schivato! +5', '#9effa0', 18); sfx.dodge(); }
    }
    if (!it.done && it.y > GROUND + 10) {

      for (const dy of [0]) { rr(x - w / 2 + 2, top + dy, w - 4, h, h / 2); fs('#d9805a', 2); }
      ctx.strokeStyle = 'rgba(120,40,20,.5)'; ctx.lineWidth = 2; for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(x + k * 14, top + 3); ctx.lineTo(x + k * 14 + 4, y - 3); ctx.stroke(); }
      break;
    case 'cotoletta':
      rr(x - w / 2 - 2, top, w + 4, h, 7); fs('#d39a3c', 2);
      ctx.fillStyle = '#a8701f'; for (let i = 0; i < 14; i++) { ctx.fillRect(x - w / 2 + 4 + (i * 13) % (w - 6), top + 3 + (i * 5) % (h - 6), 2.5, 2.5); }
      break;
    case 'melanzane':
      for (let i = 0; i < 3; i++) { const cx = x - w / 3 + i * w / 3; ell(cx, top + h / 2, w / 6 + 2, h / 2); fs('#5b2d6e', 2); ell(cx, top + h / 2, w / 6 - 4, h / 2 - 3); ctx.fillStyle = '#efe0b5'; ctx.fill(); }
      break;
    case 'pomodoro':
      for (let i = 0; i < 3; i++) { const cx = x - w / 3 + i * w / 3; ell(cx, top + h / 2, w / 6 + 2, h / 2 + 1); fs('#e2382c', 2); ctx.fillStyle = '#ff8a6a'; ell(cx, top + h / 2, w / 10, h / 4); ctx.fill(); }
      break;
  }
}
function drawBad(type, x, y, rot, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  switch (type) {
    case 'ciabatta':
      ctx.beginPath(); ctx.ellipse(0, 0, 30, 14, 0, 0, Math.PI * 2); fs('#d99a4b');
      ctx.save(); ctx.clip(); for (let i = 0; i < 9; i++) { ctx.fillStyle = '#3a2219'; ell(-24 + (i * 17) % 48, -8 + (i * 7) % 16, 3.5, 2.5, i); ctx.fill(); } ctx.restore();
      ctx.beginPath(); ctx.ellipse(0, 0, 30, 14, 0, 0, Math.PI * 2); ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.stroke();
      rr(-6, -15, 18, 30, 8); fs('#2b2b2b', 2);
      break;
    case 'bolletta':
      ctx.rotate(-.1);
      rr(-22, -28, 44, 56, 3); fs('#fff', 2.5);
      ctx.fillStyle = '#2d6cdf'; ctx.fillRect(-18, -24, 36, 8);
      ctx.fillStyle = '#999'; for (let i = 0; i < 3; i++) ctx.fillRect(-16, -10 + i * 7, 32, 3);
      ctx.fillStyle = '#d6261e'; ctx.font = `15px ${FONT_T}`; ctx.textAlign = 'center'; ctx.fillText('€€€', 0, 22);
      break;
    case 'ananas':
      ctx.fillStyle = '#3f9a4a'; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * 5, -14); ctx.lineTo(i * 8, -36 + Math.abs(i) * 5); ctx.lineTo(i * 5 + 5, -14); ctx.fill(); }
      ell(0, 4, 19, 24); fs('#e8b52a');
      ctx.strokeStyle = '#a5741a'; ctx.lineWidth = 1.5;
      for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(-18, k * 9); ctx.lineTo(18, k * 9 + 12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(18, k * 9); ctx.lineTo(-18, k * 9 + 12); ctx.stroke(); }
      break;
    case 'peperoncino':
      ctx.beginPath(); ctx.moveTo(-26, -6); ctx.quadraticCurveTo(0, -16, 22, 0); ctx.quadraticCurveTo(28, 12, 18, 10); ctx.quadraticCurveTo(0, 6, -26, 6); ctx.closePath(); fs('#e2382c');
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ell(-6, -6, 10, 2.5, -.1); ctx.fill();
      rr(-34, -5, 10, 10, 3); fs('#3f9a4a', 2);
      break;
  }
  ctx.restore();
}
function drawSpecial(type, x, y, rot, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot * .3); ctx.scale(s, s);
  ctx.shadowColor = '#fff6a0'; ctx.shadowBlur = 18 + Math.sin(t * .2) * 6;
  if (type === 'spaghetti') {
    ell(0, 8, 32, 11); fs('#fff');
    ctx.shadowBlur = 0;
    ell(0, 2, 22, 13); ctx.fillStyle = '#f2c86b'; ctx.fill();
    ctx.strokeStyle = '#d9a64a'; ctx.lineWidth = 1.5; for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(-6 + i * 3, 2, 8 + i, 0, 3.6); ctx.stroke(); }
    ell(0, -2, 13, 7); ctx.fillStyle = '#e2382c'; ctx.fill();
    ctx.fillStyle = '#3f9a4a'; ell(4, -6, 4, 2, .5); ctx.fill();
  } else {
    rr(-26, -16, 52, 32, 8); fs('#f29ac4');
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.fillRect(-26, -6, 52, 3); ctx.fillRect(-26, 4, 52, 3);
  }
  ctx.restore();
}
function drawItem(it) {
  if (it.kind === 'ing') {
    ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot); drawLayer(it.type, 0, ING[it.type].h / 2, 70); ctx.restore();
    const need = order && order.need.includes(it.type) && !order.got.includes(it.type);
    if (need) { ctx.fillStyle = '#2e8b57'; ell(it.x + 36, it.y - 12, 9, 9); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = `900 13px ${FONT_B}`; ctx.textAlign = 'center'; ctx.fillText('✓', it.x + 36, it.y - 7); }
    return;
  }
  if (it.kind === 'bad') drawBad(it.type, it.x, it.y, it.rot);
  else drawSpecial(it.type, it.x, it.y, it.rot);
  const label = it.kind === 'bad' ? BAD[it.type].n : SPECIAL[it.type].n;
  ctx.font = `900 11px ${FONT_B}`; ctx.textAlign = 'center';
  const w = ctx.measureText(label).width + 10;
  rr(it.x - w / 2, it.y + 26, w, 16, 8); ctx.fillStyle = it.kind === 'bad' ? '#d6261e' : '#2e8b57'; ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText(label, it.x, it.y + 38);
}
function drawStack(x, base, layers, topBun) {
  // vassoio
  rr(x - 58, base, 116, 9, 4); fs('#c9ced4', 2.5);
  let y = base;
  drawPane(x, y, false); y -= 10;
  for (const s of layers) { drawLayer(s, x, y); y -= ING[s].h; }
  if (topBun) drawPane(x, y + 2, true);
  return y;
}

// ---------- drawing: UI ----------
function bubble(x, y, text, up = true) {
  ctx.font = `900 15px ${FONT_B}`; ctx.textAlign = 'center';
  const w = Math.min(ctx.measureText(text).width + 22, W - 20), h = 30;
  const bx = clamp(x - w / 2, 10, W - 10 - w), by = up ? y - h - 12 : y + 12;
  ctx.beginPath(); rr(bx, by, w, h, 14); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = OUT; ctx.stroke();
  ctx.beginPath();
  const tx = clamp(x, bx + 14, bx + w - 14);
  if (up) { ctx.moveTo(tx - 7, by + h - 1); ctx.lineTo(tx, by + h + 10); ctx.lineTo(tx + 7, by + h - 1); }
  else { ctx.moveTo(tx - 7, by + 1); ctx.lineTo(tx, by - 10); ctx.lineTo(tx + 7, by + 1); }
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
  ctx.fillRect(tx - 6, up ? by + h - 4 : by + 1, 12, 4);
  ctx.fillStyle = OUT; ctx.fillText(text, bx + w / 2, by + 20);
}
function heart(x, y, on) {
  ctx.save(); ctx.translate(x, y);
  ctx.beginPath(); ctx.moveTo(0, 6); ctx.bezierCurveTo(-12, -2, -8, -12, 0, -6); ctx.bezierCurveTo(8, -12, 12, -2, 0, 6);
  ctx.fillStyle = on ? '#ff4d6d' : 'rgba(255,255,255,.25)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = OUT; ctx.stroke();
  ctx.restore();
}
function outlined(text, x, y, size, fill, font = FONT_T, lw = 6) {
  ctx.font = `${size}px ${font}`; ctx.textAlign = 'center';
  ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = OUT; ctx.strokeText(text, x, y);
  ctx.fillStyle = fill; ctx.fillText(text, x, y);
}
function drawTicket() {
  const x = 230, y = 64, w = 210, h = 108;
  ctx.save(); ctx.translate(x + w / 2, y);
  ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.lineTo(w / 2, 0); ctx.lineTo(w / 2, h);
  for (let i = 0; i <= 12; i++) ctx.lineTo(w / 2 - i * w / 12, h + (i % 2 ? 6 : 0));
  ctx.closePath(); ctx.fillStyle = '#fffdf3'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = OUT; ctx.stroke();
  ctx.fillStyle = '#d6261e'; ctx.fillRect(-w / 2 + 2, 2, w - 4, 20);
  ctx.fillStyle = '#fff'; ctx.font = `14px ${FONT_T}`; ctx.textAlign = 'center';
  if (order) {
    ctx.fillText('ORDINE #' + order.no, 0, 17);
    const n = order.need.length, gap = Math.min(48, (w - 14) / n);
    order.need.forEach((s, i) => {
      const cx = -((n - 1) * gap) / 2 + i * gap, got = order.got.includes(s);
      ctx.save(); ctx.translate(cx, 48); ctx.scale(.5, .5);
      if (got) ctx.globalAlpha = .35;
      drawLayer(s, 0, ING[s].h / 2, 70); ctx.restore();
      if (got) { ctx.fillStyle = '#2e8b57'; ctx.font = `900 22px ${FONT_B}`; ctx.fillText('✓', cx, 58); }
      ctx.fillStyle = OUT; ctx.font = `900 9px ${FONT_B}`; ctx.fillText(ING[s].n.toUpperCase(), cx, n > 2 && i % 2 ? 84 : 73);
    });
    const p = clamp(order.time / order.max, 0, 1);
    rr(-w / 2 + 10, 94, w - 20, 8, 4); ctx.fillStyle = '#e6dfd0'; ctx.fill();
    rr(-w / 2 + 10, 94, Math.max(8, (w - 20) * p), 8, 4); ctx.fillStyle = p > .5 ? '#3bb273' : p > .25 ? '#f0a020' : '#e23b3b'; ctx.fill();
  } else {
    ctx.fillText('SERVITO! ✓', 0, 17);
    outlined('🥪', 0, 66, 34, '#fff', FONT_B, 0);
  }
  ctx.restore();
}
function drawHUD() {
  const lv = L();
  ctx.fillStyle = 'rgba(26,20,36,.86)'; ctx.fillRect(0, 0, W, 56);
  ctx.textAlign = 'left'; ctx.fillStyle = '#ffd23f'; ctx.font = `22px ${FONT_T}`; ctx.fillText(score, 14, 26);
  ctx.fillStyle = '#cfc8e8'; ctx.font = `800 11px ${FONT_B}`;
  ctx.fillText(lv.goal < 99 ? `PANINI ${served}/${lv.goal}` : `PANINI ${served}`, 14, 44);
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = `17px ${FONT_T}`; ctx.fillText(level > 3 ? lv.name + ' ' + (level - 2) : lv.name, W / 2, 24);
  const bw = 150, bx = W / 2 - bw / 2;
  rr(bx, 32, bw, 14, 7); ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fill();
  const p = clamp(heat / 100, 0, 1);
  if (p > 0) { rr(bx, 32, Math.max(14, bw * p), 14, 7); ctx.fillStyle = p > .75 ? '#ff4d4d' : p > .5 ? '#ff9f43' : '#ffd23f'; ctx.fill(); }
  ctx.fillStyle = '#fff'; ctx.font = `900 10px ${FONT_B}`; ctx.fillText('CALDO ' + Math.floor(p * 100) + '%', W / 2, 43);
  for (let i = 0; i < 3; i++) heart(W - 26 - i * 26, 28, i < lives);
  if (combo >= 3) outlined('COMBO ' + combo, 66, 236, 18, '#7df9ff', FONT_T, 5);
  if (fx.frenzy > 0) outlined('🍝 x2!', W - 60, 236, 20, '#ffd23f', FONT_T, 5);
}
function panel(y, h) {
  ctx.fillStyle = 'rgba(20,16,36,.55)'; ctx.fillRect(0, 0, W, H);
  rr(28, y, W - 56, h, 22); ctx.fillStyle = '#fff8ec'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = OUT; ctx.stroke();
}
function btn(text, y, pulse = true) {
  const s = pulse ? 1 + Math.sin(t * .12) * .04 : 1;
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(s, s);
  rr(-110, -24, 220, 48, 24); ctx.fillStyle = '#d6261e'; ctx.fill(); ctx.lineWidth = 3.5; ctx.strokeStyle = OUT; ctx.stroke();
  ctx.fillStyle = '#ffd23f'; ctx.font = `22px ${FONT_T}`; ctx.textAlign = 'center'; ctx.fillText(text, 0, 8);
  ctx.restore();
}

// ---------- main draw ----------
function draw() {
  ctx.save();
  if (fx.shake > 0) ctx.translate(Math.sin(t * 3.1) * fx.shake * .5, Math.cos(t * 2.7) * fx.shake * .5);
  const bgKind = state === 'title' ? 'shop' : L().bg;
  drawBg(bgKind);
  drawCounter();
  if (state === 'title') { drawTitle(); ctx.restore(); return; }
  const boost = Math.min(combo, 12) * 1.6;
  drawChef(chef.x, GROUND, { face: chef.face, boost, heat, wiping: wipeT > 0, bob: chef.bob, talk: chef.bubbleT > 0 && chef.face === 'happy' });
  if (fx.stun > 0) { for (let i = 0; i < 3; i++) { const a = t * .15 + i * 2.1; outlined('★', chef.x + Math.cos(a) * 34, GROUND - 200 + Math.sin(a) * 8, 18, '#ffd23f', FONT_B, 3); } }
  drawStack(chef.x, TRAY, stack, false);
  if (shoutT > 0) {
    const k = 1 - shoutT / 60;
    for (let r = 0; r < 3; r++) {
      const kk = k * 1.4 - r * .18; if (kk <= 0 || kk > 1) continue;
      ctx.globalAlpha = 1 - kk; ctx.strokeStyle = '#7df9ff'; ctx.lineWidth = 8 - r * 2;
      ctx.beginPath(); ctx.arc(chef.x, GROUND - 175, 30 + kk * 420, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    const sc = 1 + Math.sin(k * Math.PI) * .15;
    ctx.save(); ctx.translate(W / 2, 300); ctx.rotate(-.05); ctx.scale(sc, sc);
    if (!window.NO_WORLD_SHOUT) outlined('KATERINAAA!', 0, 0, 52, '#7df9ff', FONT_T, 9);
    ctx.restore();
  }
  if (serveFly) {
    const k = serveFly.k, e = k * k;
    const x = serveFly.x + (110 - serveFly.x) * e, y = TRAY + (150 - TRAY) * e - Math.sin(k * Math.PI) * 120;
    ctx.save(); ctx.translate(x, y); ctx.scale(1 - k * .5, 1 - k * .5); ctx.translate(-x, -y);
    drawStack(x, y, serveFly.stack, true);
    ctx.restore();
  }
  for (const tr of trash) {
    ctx.save(); ctx.translate(tr.x, tr.y); ctx.rotate(tr.rot);
    if (tr.k === 'pane') drawPane(0, 6, false); else drawLayer(tr.k, 0, ING[tr.k].h / 2);
    ctx.restore();
  }
  for (const it of items) drawItem(it);
  for (const p of parts) { ctx.globalAlpha = clamp(p.life / 30, 0, 1); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s); }
  ctx.globalAlpha = 1;
  for (const s of texts) { ctx.globalAlpha = clamp(s.life / 30, 0, 1); outlined(s.s, s.x, s.y, s.size, s.c, FONT_T, 5); }
  ctx.globalAlpha = 1;
  drawTicket();
  if (cec.bubbleT > 0) bubble(92, 150, cec.bubble, false);
  if (chef.bubbleT > 0) bubble(chef.x, Math.min(stackTop() - 34, TRAY - 60), chef.bubble, true);
  ctx.restore();
  if (fx.frenzy > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 520);
    g.addColorStop(0, 'rgba(255,210,63,0)'); g.addColorStop(1, 'rgba(255,120,40,.35)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (heat > 75) { ctx.fillStyle = `rgba(255,80,40,${(heat - 75) / 250})`; ctx.fillRect(0, 0, W, H); }
  if (fx.hurt > 30) { ctx.fillStyle = `rgba(214,38,30,${(fx.hurt - 30) / 60})`; ctx.fillRect(0, 0, W, H); }
  drawHUD();
  if (state === 'levelup') drawLevelUp();
  if (state === 'over') drawOver();
  if (state === 'pause') { panel(300, 180); outlined('PAUSA', W / 2, 370, 44, '#ff9f43'); ctx.fillStyle = OUT; ctx.font = `800 16px ${FONT_B}`; ctx.fillText('Premi P o tocca per continuare', W / 2, 420); }
  if (muted) { ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = `800 12px ${FONT_B}`; ctx.textAlign = 'right'; ctx.fillText('🔇 audio off (M)', W - 10, H - 10); }
}

function drawTitle() {
  const bob = Math.sin(t * .07) * 4;
  drawChef(W / 2, GROUND, { face: 'happy', boost: 8 + Math.sin(t * .1) * 4, heat: 60 });
  drawStack(W / 2, TRAY, ['salsiccia', 'friarielli', 'provola'], true);
  outlined('NA COSA', W / 2, 238 + bob, 88, '#ffd23f', FONT_T, 10);
  outlined('PARTICOLARE!', W / 2, 292 + bob, 50, '#ff5e5b', FONT_T, 8);
  ctx.fillStyle = 'rgba(255,248,236,.95)'; rr(26, 312, W - 52, 210, 18); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.stroke();
  ctx.fillStyle = OUT; ctx.textAlign = 'center'; ctx.font = `800 14px ${FONT_B}`;
  ctx.fillText('Alla cassa arrivano gli ordini, tu fai i panini.', W / 2, 336);
  ctx.fillText('Prendi al volo SOLO gli ingredienti dello scontrino!', W / 2, 354);
  ['salsiccia', 'friarielli', 'provola', 'patatine', 'wurstel'].forEach((f, i) => { ctx.save(); ctx.translate(76 + i * 74, 382); ctx.scale(.6, .6); drawLayer(f, 0, 8); ctx.restore(); });
  ctx.fillStyle = '#d6261e'; ctx.font = `900 13px ${FONT_B}`; ctx.fillText('Schiva: ciabatta, bolletta, ananas e peperoncino', W / 2, 418);
  ['ciabatta', 'bolletta', 'ananas', 'peperoncino'].forEach((f, i) => drawBad(f, 112 + i * 75, 450, 0, .55));
  ctx.fillStyle = '#5a4a3a'; ctx.font = `800 12px ${FONT_B}`;
  ctx.fillText('8 ingredienti giusti di fila = urlo KATERINAAA! 📢', W / 2, 482);
  ctx.fillText('Se il CALDO arriva al 100%, lo chef si ferma ad asciugarsi 🥵', W / 2, 498);
  ctx.fillText('← → / A D oppure trascina  ·  P pausa  ·  M audio', W / 2, 514);
  if (best) outlined('🏆 Record: ' + best, W - 80, 40, 18, '#ffd23f', FONT_T, 5);
  btn('APRI LA PANINOTECA', 576);
  ctx.fillStyle = 'rgba(26,20,36,.75)'; ctx.fillRect(0, H - 24, W, 24);
  ctx.fillStyle = '#fff'; ctx.font = `700 11px ${FONT_B}`; ctx.textAlign = 'center';
  ctx.fillText('Mrcosy Games', W / 2, H - 8);
}
function drawLevelUp() {
  const lv = L();
  panel(220, 330);
  outlined('SERVIZIO FINITO!', W / 2, 285, 38, '#ff9f43');
  ctx.fillStyle = OUT; ctx.textAlign = 'center';
  ctx.font = `800 16px ${FONT_B}`; ctx.fillText(lv.name + ': completato', W / 2, 320);
  ctx.font = `italic 800 17px ${FONT_B}`; ctx.fillText(lv.quote, W / 2, 360);
  ctx.font = `800 15px ${FONT_B}`; ctx.fillText('Punti: ' + score, W / 2, 400);
  ctx.fillStyle = '#7a6a5a'; ctx.font = `700 13px ${FONT_B}`; ctx.fillText('(il ciuffo regge ancora)', W / 2, 425);
  const next = level < LEVELS.length ? LEVELS[level].name : 'Sabato sera infinito';
  ctx.fillStyle = OUT; ctx.font = `900 14px ${FONT_B}`; ctx.fillText('Prossimo turno: ' + next, W / 2, 458);
  btn('AVANTI', 508);
}
function drawOver() {
  panel(220, 340);
  outlined('SI CHIUDE!', W / 2, 285, 46, '#ff5e5b');
  ctx.fillStyle = OUT; ctx.textAlign = 'center';
  ctx.font = `italic 800 17px ${FONT_B}`; ctx.fillText(overLine, W / 2, 325);
  outlined(String(score), W / 2, 395, 54, '#ffd23f');
  ctx.font = `800 15px ${FONT_B}`; ctx.fillStyle = OUT;
  ctx.fillText(score >= best && score > 0 ? '🏆 Nuovo record!' : 'Record: ' + best, W / 2, 428);
  ctx.fillText('Turno raggiunto: ' + L().name, W / 2, 452);
  if (overT > 50) btn('RIAPRI', 512);
}

// ---------- input ----------
function advance() {
  audio();
  if (state === 'title') startGame();
  else if (state === 'levelup') { level++; startLevel(); state = 'play'; }
  else if (state === 'over' && overT > 50) { state = 'title'; }
  else if (state === 'pause') state = 'play';
}
const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
addEventListener('keydown', e => {
  if (KEYMAP[e.key]) { keys[KEYMAP[e.key]] = true; audio(); e.preventDefault(); return; }
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); advance(); }
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { if (state === 'play') state = 'pause'; else if (state === 'pause') state = 'play'; }
  if (e.key === 'm' || e.key === 'M') { muted = !muted; audio(); }
});
addEventListener('keyup', e => { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });
function toX(e) { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio(); pointerDown = true;
  if (state !== 'play') { advance(); return; }
  pointerX = toX(e);
});
addEventListener('pointermove', e => { if (state === 'play' && (pointerDown || e.pointerType === 'mouse')) pointerX = toX(e); });
addEventListener('pointerup', () => { pointerDown = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });
addEventListener('blur', () => { keys.left = keys.right = false; });

// ---------- loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(3, (now - last) / 16.667); last = now;
  update(dt); draw(); musicTick();
  requestAnimationFrame(loop);
}
say(cec, 'Chef, si apre!', 99999);
requestAnimationFrame(loop);
</script>
