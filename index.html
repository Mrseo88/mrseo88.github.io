<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mrcosy Games</title>
<meta name="description" content="One-finger arcade games for iPhone and Android: Dondo Dondo and Pip & Pop.">
<meta name="theme-color" content="#f7f3ec">
<link rel="icon" href="dondo-dondo/img/icon.png">
<style>
  @font-face { font-family: "Space Mono"; font-weight: 700; font-display: swap; src: url(fonts/SpaceMono-Bold.woff2) format("woff2"); }
  @font-face { font-family: "Space Mono"; font-weight: 400; font-display: swap; src: url(fonts/SpaceMono-Regular.woff2) format("woff2"); }
  @font-face { font-family: "Fredoka"; font-style: normal; font-weight: 300 700; font-display: swap; src: url(fonts/fredoka-latin.woff2) format("woff2"); }
  :root { --bg: #f7f3ec; --text: #24211d; --dim: #6d675e; }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 400 17px/1.6 "Fredoka", ui-rounded, system-ui, sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding-inline: 24px; }
  header { padding-block: 56px 32px; }
  h1 { font-size: clamp(40px, 7vw, 64px); line-height: 1; margin: 0 0 10px; font-weight: 700; }
  header p { margin: 0; color: var(--dim); font-size: 20px; }

  .games { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding-bottom: 48px; }
  .game {
    display: flex; flex-direction: column; border-radius: 28px; overflow: hidden; text-decoration: none; color: inherit;
    box-shadow: 0 16px 40px rgba(36,33,29,.10); transition: transform .18s, box-shadow .18s;
  }
  .game:hover { transform: translateY(-4px); box-shadow: 0 22px 50px rgba(36,33,29,.16); }
  .game img.cover { width: 100%; height: auto; aspect-ratio: 1024 / 500; object-fit: cover; display: block; }
  .game .body { padding: 22px 24px 26px; display: flex; gap: 16px; align-items: flex-start; flex: 1; }
  .game .icon { width: 56px; height: 56px; border-radius: 14px; flex: none; }
  .game h2 { margin: 0 0 4px; font-size: 24px; line-height: 1.15; }
  .game p { margin: 0 0 12px; }
  .game .go { font-weight: 600; }

  /* ogni scheda nello stile del suo gioco */
  .dondo {
    background-color: #f4efe3; font-family: "Space Mono", ui-monospace, Menlo, monospace; font-size: 15px;
    background-image: linear-gradient(rgba(84,128,170,.14) 1px, transparent 1px), linear-gradient(90deg, rgba(84,128,170,.14) 1px, transparent 1px);
    background-size: 24px 24px; border: 2px solid #211f1b;
  }
  .dondo h2 { font-weight: 700; }
  .dondo p { color: rgba(33,31,27,.7); }
  .dondo .go { color: #e03a2a; font-weight: 700; }
  .pip { background: linear-gradient(180deg, #fff6ea, #ffe0d2); color: #2d2350; }
  .pip h2 { font-weight: 700; }
  .pip p { color: #6b6385; }
  .pip .go { color: #ff6b3d; }

  footer { border-top: 1px solid rgba(36,33,29,.12); padding-block: 24px 40px; color: var(--dim); font-size: 15px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }
  footer a { color: var(--text); }

  @media (max-width: 760px) {
    header { padding-block: 32px 24px; }
    .games { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .game { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mrcosy Games</h1>
    <p>Tiny arcade games you play with one finger.</p>
  </header>

  <main class="games">
    <a class="game dondo" href="dondo-dondo/">
      <img class="cover" src="dondo-dondo/img/og.png" alt="Dondo Dondo" width="1024" height="500">
      <div class="body">
        <img class="icon" src="dondo-dondo/img/icon.png" alt="">
        <div>
          <h2>Dondo Dondo</h2>
          <p>Tap to swap the pivot and climb before the tide catches you.</p>
          <span class="go">Discover &rarr;</span>
        </div>
      </div>
    </a>
    <a class="game pip" href="pip-and-pop/">
      <img class="cover" src="pip-and-pop/img/og.jpg" alt="Pip & Pop" width="1024" height="500">
      <div class="body">
        <img class="icon" src="pip-and-pop/img/icon.png" alt="">
        <div>
          <h2>Pip &amp; Pop</h2>
          <p>Hold to open, release to close. Guide two lights through an endless rush.</p>
          <span class="go">Discover &rarr;</span>
        </div>
      </div>
    </a>
  </main>

  <footer>
    <span>© 2026 Mrcosy</span>
    <span>Privacy: <a href="dondo-dondo/privacy/">Dondo Dondo</a> · <a href="pip-and-pop/privacy/">Pip &amp; Pop</a></span>
  </footer>
</div>
</body>
</html>
